name: Build OrangeFox Recovery (Infinix-X689)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-recovery:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/infinix/X689

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install Build Dependencies & Setup Git
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 openjdk-8-jdk rsync bc cpio
          
          # Install official standalone repo tool
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync OrangeFox 12.1 Manifest
        run: |
          mkdir -p /home/runner/OrangeFox_sync
          cd /home/runner/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          yes | ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox_12.1

      - name: Link Infinix X689 Device Tree
        run: |
          mkdir -p /home/runner/fox_12.1/device/infinix
          cp -r $GITHUB_WORKSPACE/device/infinix/X689 /home/runner/fox_12.1/device/infinix/
          ls -la /home/runner/fox_12.1/device/infinix/X689

      - name: Compile OrangeFox (bootimage)
        run: |
          cd /home/runner/fox_12.1
          
          # Disable shell exit-on-error temporarily while sourcing envsetup
          set +e
          source build/envsetup.sh
          set -e
          
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=X689
          export LC_ALL="C"
          
          lunch omni_X689-eng || lunch omni_X689-userdebug
          mka adbd bootimage -j$(nproc --all)

      - name: Upload Compiled Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Unofficial-Infinix-X689
          path: |
            /home/runner/fox_12.1/out/target/product/X689/boot.img
            /home/runner/fox_12.1/out/target/product/X689/OrangeFox*.zip
            /home/runner/fox_12.1/out/target/product/X689/OrangeFox*.img
          if-no-files-found: error
