name: Build OrangeFox Recovery (Infinix-X689)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-recovery:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/infinix/X689

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install Build Dependencies & Setup Git
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 openjdk-8-jdk rsync bc cpio
          
          # Install standalone Google repo tool
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync OrangeFox 11.0 Minimal Manifest
        run: |
          mkdir -p ~/fox_11.0
          cd ~/fox_11.0
          
          # Initialize OrangeFox R11.0 manifest with depth 1 to save disk space
          repo init -u https://gitlab.com/OrangeFox/manifest.git -b fox_11.0 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Link Infinix X689 Device Tree
        run: |
          mkdir -p ~/fox_11.0/device/infinix
          # Move the checked-out workspace directly into the tree
          cp -r $GITHUB_WORKSPACE/device/infinix/X689 ~/fox_11.0/device/infinix/
          ls -la ~/fox_11.0/device/infinix/X689

      - name: Compile OrangeFox (bootimage)
        run: |
          cd ~/fox_11.0
          source build/envsetup.sh
          
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=X689
          export LC_ALL="C"
          
          lunch omni_X689-eng
          mka adbd bootimage -j$(nproc --all)

      - name: Upload Compiled Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R11.1-Unofficial-Infinix-X689
          path: |
            ~/fox_11.0/out/target/product/X689/boot.img
            ~/fox_11.0/out/target/product/X689/OrangeFox*.zip
            ~/fox_11.0/out/target/product/X689/OrangeFox*.img
          if-no-files-found: error
